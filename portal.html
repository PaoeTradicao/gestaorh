<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Colaborador · Pão & Tradição</title>
<meta name="theme-color" content="#13215E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal Colaborador">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#13215E; --azul-2:#1c2f7a; --ouro:#EFAD4C; --ouro-claro:#FBF3E8;
    --creme:#F5F0DC; --texto-2:#5B7184; --texto-3:#8b95a8;
    --borda:#e9e6da; --borda-forte:#d8d3c0;
    --verde:#1D9E75; --vermelho:#C0392B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--creme);color:var(--azul);min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;color:var(--azul);font-weight:700}
  a{color:inherit}
  .hidden{display:none!important}

  .topo-marca{background:var(--azul);padding:1.1rem 1.2rem;text-align:center;position:relative;overflow:hidden}
  .topo-marca::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,var(--ouro),var(--ouro-claro),var(--ouro))}
  .topo-marca h1{color:#fff;font-size:1.1rem;font-weight:800;letter-spacing:.02em}
  .topo-marca .sub{color:var(--ouro);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

  .wrap{max-width:520px;margin:0 auto;padding:1.6rem 1.1rem 3rem}
  .app-body{padding-top:1.2rem;padding-bottom:5.4rem}

  .card{background:#fff;border-radius:14px;padding:1.4rem;box-shadow:0 2px 10px rgba(19,33,94,.07);margin-bottom:1.1rem;border:1px solid var(--borda)}

  label{display:block;font-size:.72rem;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
  input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--borda-forte);border-radius:9px;font-size:.9rem;margin-bottom:1.1rem;font-family:inherit;color:var(--azul);background:#fcfbf7;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ouro);background:#fff}
  textarea{min-height:90px;resize:vertical}
  input[type="checkbox"]{width:auto;margin:0}

  .btn{padding:9px 17px;border:none;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:background .15s}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-azul:hover{background:var(--azul-2)}
  .btn-outline{background:#fff;border:1px solid var(--borda-forte);color:var(--azul)}
  .btn-outline:hover{background:var(--ouro-claro)}
  .btn-sm{padding:6px 12px;font-size:.76rem}
  .btn-full{width:100%}

  .erro{color:var(--vermelho);font-size:.83rem;margin-bottom:.7rem;min-height:1rem;font-weight:500}
  .login-hint{font-size:.78rem;color:var(--texto-2);text-align:center;margin-top:.9rem;line-height:1.5}

  .abas{display:flex;gap:.4rem;margin-bottom:1.1rem;background:#fff;border-radius:11px;padding:5px;border:1px solid var(--borda)}
  .aba-btn{flex:1;text-align:center;padding:9px 8px;border-radius:8px;font-size:.83rem;font-weight:700;color:var(--texto-2);cursor:pointer;transition:all .15s}
  .aba-btn.ativa{background:var(--azul);color:#fff}

  .doc-tipo{font-size:.74rem;font-weight:800;color:var(--ouro);margin:1.2rem 0 .6rem;text-transform:uppercase;letter-spacing:.06em}
  .doc-tipo:first-child{margin-top:0}
  .doc-item{display:flex;justify-content:space-between;align-items:center;gap:.7rem;padding:.75rem 0;border-bottom:1px solid var(--borda);font-size:.92rem}
  .doc-item:last-child{border-bottom:none}
  .doc-item .ref{font-weight:600}

  .ocor-item{padding:.8rem 0;border-bottom:1px solid var(--borda)}
  .ocor-item:last-child{border-bottom:none}
  .ocor-tag{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;background:var(--ouro-claro);color:#8a5a00;margin-bottom:.4rem}
  .ocor-data{font-size:.78rem;color:var(--texto-2)}
  .ocor-motivo{font-size:.88rem;margin-top:.25rem}

  .vazio{color:var(--texto-3);font-size:.86rem;padding:1.4rem 0;text-align:center}
  .rodape{text-align:center;font-size:.72rem;color:var(--texto-3);margin-top:1.6rem}

  /* Topo do app (logado) */
  .app-top{background:var(--azul);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;position:sticky;top:0;z-index:80}
  .app-top .logo-mini{color:#fff;font-weight:800;font-size:.92rem}
  .app-top-acoes{display:flex;align-items:center;gap:.3rem}
  .icon-btn{background:transparent;border:none;color:#fff;padding:7px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:rgba(255,255,255,.14)}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.escuro{color:var(--azul)}
  .busca-caixa{position:relative}
  .busca-input{display:none;position:absolute;right:0;top:40px;width:min(84vw,320px);background:#fff;border:1px solid var(--borda-forte);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:0;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .busca-input.aberta{display:block}
  .busca-resultados{position:absolute;right:0;top:88px;width:min(84vw,320px);background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:90;max-height:320px;overflow:auto}
  .busca-item{padding:.6rem .8rem;border-bottom:1px solid var(--borda);font-size:.82rem;cursor:pointer}
  .busca-item:last-child{border-bottom:none}
  .busca-item:hover{background:var(--ouro-claro)}
  .busca-item .tipo{font-size:.63rem;text-transform:uppercase;color:var(--texto-2);font-weight:800;letter-spacing:.04em}

  /* Navegação inferior */
  .navbar-inferior{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borda);display:flex;z-index:70;padding-bottom:env(safe-area-inset-bottom)}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--texto-3);font-size:.6rem;font-weight:700;cursor:pointer;border:none;background:transparent;font-family:inherit}
  .nav-item svg{width:20px;height:20px}
  .nav-item.ativa{color:var(--azul)}

  /* Views */
  .view{display:none}
  .view.ativa{display:block}

  .dash-banner{background:linear-gradient(120deg,var(--azul),var(--azul-2));color:#fff;border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.1rem;position:relative;overflow:hidden}
  .dash-banner::after{content:"";position:absolute;right:-24px;top:-24px;width:130px;height:130px;border-radius:50%;background:rgba(239,173,76,.22)}
  .dash-banner h3{color:var(--ouro);font-size:1rem;margin-bottom:.35rem}
  .dash-banner p{margin:0;font-size:.85rem;line-height:1.5;opacity:.95;position:relative;z-index:1}

  .dash-saudacao{margin-bottom:1.1rem}
  .dash-saudacao h1{font-size:1.3rem}
  .dash-saudacao p{color:var(--texto-2);margin:2px 0 0;font-size:.85rem}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .dash-card{background:#fff;border-radius:14px;padding:1.1rem .95rem;border:1px solid var(--borda);box-shadow:0 2px 10px rgba(19,33,94,.06);cursor:pointer;transition:transform .12s;display:flex;flex-direction:column;gap:.55rem}
  .dash-card:active{transform:scale(.97)}
  .dash-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .dash-card .ic svg{width:19px;height:19px}
  .dash-card h4{font-size:.86rem}
  .dash-card .contagem{font-size:.72rem;color:var(--texto-2)}
  .dash-card.c-azul .ic{background:var(--azul);color:#fff}
  .dash-card.c-ouro .ic{background:var(--ouro);color:#fff}
  .dash-card.c-verde .ic{background:var(--verde);color:#fff}
  .dash-card.c-vermelho .ic{background:var(--vermelho);color:#fff}
  .dash-card.c-neutro .ic{background:var(--texto-2);color:#fff}

  .sub-topo{margin-bottom:1rem}
  .sub-topo h2{font-size:1.15rem}

  .filtro-busca{width:100%;padding:9px 12px;border:1px solid var(--borda-forte);border-radius:9px;font-size:.85rem;margin-bottom:1rem;font-family:inherit}

  .card-item{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--borda);margin-bottom:.9rem;box-shadow:0 2px 8px rgba(19,33,94,.05)}
  .card-item img{width:100%;height:130px;object-fit:cover;display:block;background:var(--ouro-claro)}
  .card-item .corpo{padding:1rem}
  .card-item h4{font-size:.96rem;margin-bottom:.3rem}
  .card-item .categoria{font-size:.66rem;font-weight:800;color:var(--ouro);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
  .card-item p{font-size:.83rem;color:var(--texto-2);margin:0 0 .8rem;line-height:1.45}
  .card-item .acoes{display:flex;flex-wrap:wrap;gap:.5rem}

  .concluido-tag{display:inline-flex;align-items:center;gap:5px;color:var(--verde);font-weight:700;font-size:.78rem}
  .concluido-tag svg{width:15px;height:15px}

  .feed-item{background:#fff;border-radius:14px;padding:1rem;border:1px solid var(--borda);margin-bottom:.9rem;box-shadow:0 2px 8px rgba(19,33,94,.05)}
  .feed-item.fixado{border-color:var(--ouro);background:var(--ouro-claro)}
  .feed-item img{width:100%;border-radius:9px;margin:.5rem 0;display:block}
  .feed-item .meta{font-size:.72rem;color:var(--texto-2);display:flex;justify-content:space-between;margin-bottom:.4rem}
  .feed-item .fix-badge{display:inline-flex;align-items:center;gap:4px;color:#8a5a00;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
  .feed-item .fix-badge svg{width:13px;height:13px}
  .feed-item h4{font-size:.95rem;margin-bottom:.4rem}
  .feed-item p{font-size:.87rem;line-height:1.55;margin:0;white-space:pre-wrap}

  .perfil-cabecalho{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.1rem}
  .perfil-foto{width:88px;height:88px;border-radius:50%;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;overflow:hidden;margin-bottom:.7rem}
  .perfil-foto img{width:100%;height:100%;object-fit:cover}
  .perfil-cargo{color:var(--texto-2);font-size:.85rem;margin-top:2px}
  .perfil-stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem}
  .perfil-stat{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:.9rem;text-align:center}
  .perfil-stat .num{font-size:1.3rem;font-weight:800;color:var(--azul)}
  .perfil-stat .lbl{font-size:.68rem;color:var(--texto-2);text-transform:uppercase;font-weight:700;letter-spacing:.03em}

  /* Painel Administrativo */
  .admin-shell{position:fixed;inset:0;background:var(--creme);z-index:150;display:none;flex-direction:column}
  .admin-shell.aberta{display:flex}
  .admin-top{background:var(--azul);color:#fff;padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .admin-top h2{color:#fff;font-size:1rem}
  .admin-tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 1rem;background:#fff;border-bottom:1px solid var(--borda);flex-shrink:0}
  .admin-tab-btn{white-space:nowrap;padding:7px 13px;border-radius:20px;border:1px solid var(--borda-forte);background:#fff;font-size:.78rem;font-weight:700;color:var(--texto-2);cursor:pointer;font-family:inherit}
  .admin-tab-btn.ativa{background:var(--azul);color:#fff;border-color:var(--azul)}
  .admin-conteudo{flex:1;overflow:auto;padding:1.1rem 1.1rem 6rem;max-width:640px;margin:0 auto;width:100%}
  .admin-lista-item{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:.8rem .9rem;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
  .admin-lista-item .info{flex:1;min-width:0}
  .admin-lista-item .info h5{font-size:.88rem;margin-bottom:2px;font-weight:700}
  .admin-lista-item .info small{color:var(--texto-2);font-size:.72rem}
  .admin-lista-item .btns{display:flex;gap:.4rem;flex-shrink:0}
  .btn-icon{background:#fff;border:1px solid var(--borda-forte);border-radius:8px;padding:6px;display:flex;cursor:pointer}
  .btn-icon svg{width:16px;height:16px}
  .btn-icon.perigo{color:var(--vermelho);border-color:#e9c6c0}
  .btn-fab{position:fixed;right:1.1rem;bottom:5.6rem;background:var(--azul);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(19,33,94,.35);cursor:pointer;z-index:60}
  .btn-fab svg{width:22px;height:22px}
  .btn-fab-admin{position:fixed;right:1.4rem;bottom:1.4rem}
  .checkbox-linha{display:flex;align-items:center;gap:8px;margin-bottom:1.1rem;font-size:.85rem;font-weight:500}
  .form-linha2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .form-linha2 > div{min-width:0}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(19,33,94,.55);z-index:210;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.aberto{display:flex}
  .modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:1.3rem}
  .modal-box .topo-modal{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem}
  .modal-box .topo-modal h3{font-size:1.02rem}

  /* Visualizador de PDF embutido */
  #visualizador-overlay{position:fixed;inset:0;background:rgba(19,33,94,.85);z-index:220;display:none;flex-direction:column}
  #visualizador-overlay.aberto{display:flex}
  .visualizador-topo{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:var(--azul);flex-shrink:0}
  .visualizador-topo span{color:#fff;font-weight:600;font-size:.9rem}
  .visualizador-fechar{background:transparent!important;border:1px solid #fff!important;color:#fff!important}
  #visualizador-paginas{flex:1;overflow:auto;background:#5B5B5B;padding:1rem 0;text-align:center}
  #visualizador-paginas canvas{max-width:96%;height:auto!important;margin-bottom:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.3);background:#fff}
  #visualizador-carregando{color:#fff;padding:2rem;font-size:.9rem}
</style>
</head>
<body>

<div class="topo-marca">
  <h1>Pão &amp; Tradição</h1>
  <div class="sub">Portal do Colaborador</div>
</div>

<div class="wrap" id="tela-login">
  <div class="card" id="tela-login-card">
    <div class="erro" id="login-erro"></div>
    <form id="form-login" onsubmit="event.preventDefault(); fazerLoginPortal();">
      <label>Nome completo</label>
      <input type="text" id="login-nome" name="username" placeholder="Digite seu nome completo" autocomplete="username">
      <label>CPF</label>
      <input type="password" id="login-cpf" name="password" placeholder="Só números" inputmode="numeric" autocomplete="current-password">
      <button type="submit" class="btn btn-azul btn-full">Entrar</button>
    </form>
    <div class="login-hint">Use seu nome completo e o CPF (só números) para entrar.<br>Em caso de dúvida, procure o RH.</div>
  </div>
</div>

<div id="app-shell" style="display:none">
  <div class="app-top">
    <div class="logo-mini">Portal do Colaborador</div>
    <div class="app-top-acoes">
      <div class="busca-caixa">
        <button class="icon-btn" onclick="toggleBusca()"><span id="busca-btn-icone"></span></button>
        <input class="busca-input" id="busca-input" placeholder="Buscar documentos, benefícios..." oninput="buscarGlobal(this.value)">
        <div class="busca-resultados" id="busca-resultados"></div>
      </div>
      <button class="icon-btn" id="btn-admin-gear" style="display:none" onclick="abrirAdmin()"><span id="admin-gear-icone"></span></button>
      <button class="icon-btn" onclick="sairPortal()"><span id="sair-icone"></span></button>
    </div>
  </div>

  <div class="wrap app-body">
    <div class="view ativa" id="view-dashboard"></div>
    <div class="view" id="view-documentos"></div>
    <div class="view" id="view-beneficios"></div>
    <div class="view" id="view-treinamentos"></div>
    <div class="view" id="view-comunicados"></div>
    <div class="view" id="view-perfil"></div>
  </div>

  <div class="navbar-inferior" id="navbar-inferior"></div>
</div>

<div class="admin-shell" id="admin-shell">
  <div class="admin-top">
    <h2>Painel Administrativo</h2>
    <button class="icon-btn" onclick="fecharAdmin()"><span id="admin-fechar-icone"></span></button>
  </div>
  <div class="admin-tabs" id="admin-tabs"></div>
  <div class="admin-conteudo" id="admin-conteudo"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="visualizador-overlay">
  <div class="visualizador-topo">
    <span id="visualizador-titulo">Documento</span>
    <button class="btn btn-outline btn-sm visualizador-fechar" onclick="fecharVisualizador()">Fechar</button>
  </div>
  <div id="visualizador-paginas"><div id="visualizador-carregando">Carregando...</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if(window['pdfjsLib']) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script type="module">

  import { getAuth, signInWithEmailAndPassword, signOut, updatePassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, addDoc, updateDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDyxGKkYEVxqQxW45nAR5ElQPWHh6SgSbU",
    authDomain: "gestao-de-rh-paoetradicao.firebaseapp.com",
    projectId: "gestao-de-rh-paoetradicao",
    storageBucket: "gestao-de-rh-paoetradicao.firebasestorage.app",
    messagingSenderId: "361260253500",
    appId: "1:361260253500:web:a2cc3fa027576ef9cf9e39"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const dbF = getFirestore(app);

  // ===== Tipos fixos de UI (não são conteúdo, apenas rótulos de categorias já usadas pelo sistema) =====
  const TIPOS = {
    holerite_mensal: 'Holerite mensal',
    holerite_ferias: 'Holerite/Recibo de férias',
    aviso_ferias: 'Aviso de férias',
    folha_ponto: 'Folha de ponto'
  };
  const TIPOS_OCORRENCIA = {
    atestado: 'Atestado', suspensao: 'Suspensão', afastamento: 'Afastamento',
    advertencia: 'Advertência', rescisao: 'Rescisão', falta_registro_ponto: 'Falta de registro de ponto'
  };

  // ===== Ícones (SVG inline, sem emojis) =====
  const ICONES = {
    inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',

  // ===== Utilitários =====
  function normalizar(nome){
    return String(nome||'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');
  }
  function formatarDataBR(iso){
    if(!iso) return '—';
    const p = String(iso).slice(0,10).split('-');
    return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso;
  }
  function base64ParaBlob(base64, tipoMime){
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for(let i=0;i<binario.length;i++) bytes[i]=binario.charCodeAt(i);
    return new Blob([bytes], { type: tipoMime||'application/pdf' });
  }
  function valorAttr(v){ return String(v||'').replace(/"/g,'&quot;'); }
  function escaparAspas(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
  function resumir(txt,n){ txt = String(txt||''); return txt.length>n ? txt.slice(0,n)+'…' : txt; }
  function statBox(num,lbl){ return '<div class="perfil-stat"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
  function saudacaoHora(){
    const h = new Date().getHours();
    if(h<12) return 'Bom dia';
    if(h<18) return 'Boa tarde';
    return 'Boa noite';
  }
  function calcularTempoEmpresa(iso){
    if(!iso) return '';
    const inicio = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(inicio.getTime())) return '';
    const agora = new Date();
    let anos = agora.getFullYear()-inicio.getFullYear();
    let meses = agora.getMonth()-inicio.getMonth();
    if(agora.getDate()<inicio.getDate()) meses--;
    if(meses<0){ anos--; meses+=12; }
    if(anos<0) return '';
    const partes=[];
    if(anos>0) partes.push(anos+(anos===1?' ano':' anos'));
    if(meses>0||partes.length===0) partes.push(meses+(meses===1?' mês':' meses'));
    return partes.join(' e ');
  }
  function calcularAnosCompletosEmpresa(iso){
    if(!iso) return 0;
    const inicio = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(inicio.getTime())) return 0;
    const agora = new Date();
    let anos = agora.getFullYear()-inicio.getFullYear();
    return anos;
  }
  function ehMesAdmissao(iso){
    if(!iso) return false;
    const d = new Date(String(iso).slice(0,10)+'T00:00:00');
    if(isNaN(d.getTime())) return false;
    return d.getMonth() === new Date().getMonth();
  }
  function arquivoParaBase64(file){
    return new Promise(function(resolve,reject){
      const reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ===== Visualizador de documentos (PDF pessoal, base64) =====
  window.verDocumentoPortal = async function(idx){
    const d = window._meusDocumentos[idx];
    if(!d || !d.base64) return;
    document.getElementById('visualizador-titulo').textContent = d.referencia || 'Documento';
    const cont = document.getElementById('visualizador-paginas');
    cont.innerHTML = '<div id="visualizador-carregando">Carregando...</div>';
    document.getElementById('visualizador-overlay').classList.add('aberto');
    try{
      const bytes = base64ParaBlob(d.base64);
      const buffer = await bytes.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      cont.innerHTML = '';
      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        cont.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
      }
    }catch(e){
      cont.innerHTML = '<div id="visualizador-carregando">Não foi possível abrir esse documento. Tente baixar em vez de ver.</div>';
    }
  };
  window.fecharVisualizador = function(){
    document.getElementById('visualizador-overlay').classList.remove('aberto');
    document.getElementById('visualizador-paginas').innerHTML = '';
  };
  window.baixarDocumentoPortal = function(idx, ev){
    if(ev) ev.preventDefault();
    const d = window._meusDocumentos[idx];
    if(!d || !d.base64) return;
    const blob = base64ParaBlob(d.base64);
    const a = document.createElement('a');
    const objUrl = URL.createObjectURL(blob);
    a.href = objUrl;
    a.download = (d.nomeArquivo||'documento').replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(objUrl); }, 10000);
  };

  window.filtrarDocumentos = function(q){
    const termo = normalizar(q);
    const filtrados = listaDocumentos.filter(function(d){
      return normalizar(d.referencia||'').indexOf(termo)>=0 || normalizar(TIPOS[d.tipo]||'').indexOf(termo)>=0;
    });
    desenharListaDocumentos(filtrados);
  };
  function desenharListaDocumentos(lista){
    const cont = document.getElementById('doc-lista-nova');
    if(!lista.length){ cont.innerHTML = '<div class="vazio">Nenhum documento encontrado.</div>'; return; }
    const grupos = {};
    lista.forEach(function(d){
      const idx = listaDocumentos.indexOf(d);
      d._idx = idx;
      const ano = (d.enviadoEm||'').slice(0,4) || 'Sem data';
      const chaveTipo = d.tipo || 'outros';
      grupos[chaveTipo] = grupos[chaveTipo] || {};
      grupos[chaveTipo][ano] = grupos[chaveTipo][ano] || [];
      grupos[chaveTipo][ano].push(d);
    });
    let html = '';
    Object.keys(TIPOS).forEach(function(tipo){
      if(!grupos[tipo]) return;
      html += '<div class="doc-tipo">'+TIPOS[tipo]+'</div>';
      const anos = Object.keys(grupos[tipo]).sort().reverse();
      anos.forEach(function(ano){
        if(anos.length>1) html += '<div style="font-size:.72rem;font-weight:700;color:var(--texto-2);margin:.5rem 0 .3rem">'+ano+'</div>';
        grupos[tipo][ano].sort(function(a,b){ return (b.enviadoEm||'').localeCompare(a.enviadoEm||''); }).forEach(function(d){
          html += '<div class="doc-item"><span class="ref">'+(d.referencia||'—')+'</span><span style="display:flex;gap:.5rem">'+
            '<button class="btn btn-outline btn-sm" onclick="verDocumentoPortal('+d._idx+')">Ver</button>'+
            '<button class="btn btn-outline btn-sm" onclick="baixarDocumentoPortal('+d._idx+',event)">Baixar</button>'+
          '</span></div>';
        });
      });
    });
    cont.innerHTML = html || '<div class="vazio">Nenhum documento disponível ainda.</div>';
  }
  function desenharOcorrencias(){
    const cont = document.getElementById('ocor-lista-nova');
    if(!listaOcorrencias.length){ cont.innerHTML = '<div class="vazio">Nenhuma ocorrência registrada.</div>'; return; }
    const ordenadas = listaOcorrencias.slice().sort(function(a,b){ return (b.dataInicio||'').localeCompare(a.dataInicio||''); });
    cont.innerHTML = ordenadas.map(function(o){
      return '<div class="ocor-item">'+

  function desenharComunicados(){
    const cont = document.getElementById('comunicados-lista');
    const hoje = new Date().toISOString().slice(0,10);
    const visiveis = listaComunicados.filter(function(c){ return !c.agendadoPara || c.agendadoPara<=hoje; });
    if(!visiveis.length){ cont.innerHTML = '<div class="vazio">Nenhum comunicado no momento.</div>'; return; }
    const ordenados = visiveis.slice().sort(function(a,b){
      const pf = (b.fixado?1:0)-(a.fixado?1:0);
      if(pf!==0) return pf;
      return (b.data||'').localeCompare(a.data||'');
    });
    cont.innerHTML = ordenados.map(function(c){
      return '<div class="feed-item'+(c.fixado?' fixado':'')+'">'+
        (c.fixado?('<div class="fix-badge">'+icone('pin')+' Fixado</div>'):'')+
        '<div class="meta"><span>'+(c.autor||'Pão & Tradição')+'</span><span>'+formatarDataBR(c.data)+'</span></div>'+
        '<h4>'+(c.titulo||'')+'</h4>'+
        (c.imagem?('<img src="'+c.imagem+'" alt="">'):'')+
        '<p>'+(c.texto||'')+'</p>'+
      '</div>';
    }).join('');
  }

    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(function(d){ docs.push(Object.assign({_id:d.id}, d.data())); });
    if(!docs.length){ cont.innerHTML = '<div class="vazio">Nenhum documento para este funcionário.</div>'; return; }
    cont.innerHTML = docs.sort(function(a,b){ return (b.enviadoEm||'').localeCompare(a.enviadoEm||''); }).map(function(d){
      return '<div class="admin-lista-item"><div class="info"><h5>'+(d.referencia||'')+'</h5><small>'+(TIPOS[d.tipo]||d.tipo)+'</small></div>'+
        '<div class="btns"><button class="btn-icon perigo" onclick="excluirItem(\'portal_documentos\',\''+d._id+'\',\'recarregarDocsAdmin\')">'+icone('excluir')+'</button></div></div>';
    }).join('');
  };
  window.abrirFormDocumento = function(){
    if(!docAdminFuncionarioId){ alert('Selecione um funcionário primeiro.'); return; }
    const opcoesTipo = Object.keys(TIPOS).map(function(k){ return '<option value="'+k+'">'+TIPOS[k]+'</option>'; }).join('');
    document.getElementById('modal-box').innerHTML =
      '<div class="topo-modal"><h3>Novo documento</h3><button class="icon-btn escuro" onclick="fecharModal()">'+icone('fechar')+'</button></div>'+
      '<label>Categoria</label><select id="f-doc-tipo">'+opcoesTipo+'</select>'+
      '<label>Referência (ex: Janeiro 2026)</label><input id="f-doc-ref">'+
      '<label>Arquivo (PDF)</label><input type="file" id="f-doc-arquivo" accept="application/pdf">'+
      '<div class="erro" id="f-doc-erro"></div>'+
      '<button class="btn btn-azul btn-full" onclick="salvarDocumentoAdmin()">Salvar documento</button>';
    document.getElementById('modal-overlay').classList.add('aberto');
  };
  window.salvarDocumentoAdmin = async function(){
    const tipo = document.getElementById('f-doc-tipo').value;
    const referencia = document.getElementById('f-doc-ref').value.trim();
    const arquivoInput = document.getElementById('f-doc-arquivo');
    const erroEl = document.getElementById('f-doc-erro');
    erroEl.textContent = '';
    if(!referencia || !arquivoInput.files[0]){ erroEl.textContent='Preencha a referência e escolha um arquivo.'; return; }
    try{
      const base64 = await arquivoParaBase64(arquivoInput.files[0]);
      await addDoc(collection(dbF,'portal_documentos'), {
        funcionarioId: docAdminFuncionarioId, tipo: tipo, referencia: referencia,
        nomeArquivo: arquivoInput.files[0].name, base64: base64, enviadoEm: new Date().toISOString()
      });
      fecharModal();
      recarregarDocsAdmin();
    }catch(e){ erroEl.textContent='Não foi possível salvar o documento agora.'; }
  };

  function renderAdminUsuarios(){
    const cont = document.getElementById('admin-conteudo');
    cont.innerHTML = '<div class="vazio">Carregando...</div>';
    carregarFuncionariosAdmin(true).then(function(){
      if(!listaFuncionariosAdmin.length){ cont.innerHTML = '<div class="vazio">Nenhum usuário encontrado.</div>'; return; }
      cont.innerHTML = listaFuncionariosAdmin.map(function(f){
        return '<div class="admin-lista-item"><div class="info"><h5>'+(f.nome||'')+'</h5><small>'+(f.cargo||'')+'</small></div>'+
          '<label class="checkbox-linha" style="margin:0"><input type="checkbox" '+(f.admin?'checked':'')+' onchange="alternarAdmin(\''+f._id+'\',this.checked)"> Admin</label>'+
        '</div>';
      }).join('');
    });
  }
  window.recarregarUsuariosAdmin = function(){ renderAdminUsuarios(); };
  window.alternarAdmin = async function(uid, valor){
    try{ await updateDoc(doc(dbF,'portal_funcionarios',uid), { admin: valor }); }
    catch(e){ alert('Não foi possível atualizar agora.'); }
  };

  function renderAdminConfiguracoes(){
    document.getElementById('admin-conteudo').innerHTML =
      '<div class="card"><h4 style="margin-bottom:.6rem">Portal do Colaborador</h4>'+
      '<p style="color:var(--texto-2);font-size:.85rem;line-height:1.65">Todo o conteúdo é administrado por aqui e fica salvo no Firestore, nas coleções portal_beneficios, portal_treinamentos, portal_comunicados, portal_documentos e portal_funcionarios. Nenhuma configuração adicional é necessária.</p></div>';
  }

  window.excluirItem = function(colName, id, reloadFnName){
    if(!confirm('Excluir este item? Esta ação não pode ser desfeita.')) return;
    deleteDoc(doc(dbF,colName,id)).then(function(){
      if(reloadFnName && window[reloadFnName]) window[reloadFnName]();
    }).catch(function(){ alert('Não foi possível excluir agora.'); });
  };

  // ===== Ciclo de autenticação =====
  onAuthStateChanged(auth, async function(user){
    if(!user){
      document.getElementById('tela-login').style.display = '';
      document.getElementById('app-shell').style.display = 'none';
      document.getElementById('admin-shell').classList.remove('aberta');
      return;
    }
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('app-shell').style.display = '';
    let perfilSnap;
    try{ perfilSnap = await getDoc(doc(dbF,'portal_funcionarios', user.uid)); }
    catch(e){ document.getElementById('view-dashboard').innerHTML = '<div class="vazio">Não foi possível carregar seus dados agora. Tente novamente em instantes.</div>'; return; }
    if(!perfilSnap.exists()){
      document.getElementById('view-dashboard').innerHTML = '<div class="vazio">Seu cadastro ainda não está pronto. Fale com o RH.</div>';
      return;
    }
    perfilAtual = perfilSnap.data();
    funcionarioIdAtual = perfilAtual.funcionarioId;
    isAdmin = perfilAtual.admin === true;
    document.getElementById('btn-admin-gear').style.display = isAdmin ? '' : 'none';
    await carregarTudo();
    renderDashboard();
    renderDocumentosView();
    renderBeneficiosView();
    renderTreinamentosView();
    renderComunicadosView();
    renderPerfilView();
    mostrarView('dashboard');
  });
</script>
</body>
</html>
