<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Colaborador · Pão & Tradição</title>
<style>
  :root{ --azul:#13215E; --ouro:#EFAD4C; --creme:#F5F0DC; --texto-2:#5B7184; --borda:#e4e4ea; --borda-forte:#d6d6de; --verde:#1D9E75; --vermelho:#C0392B; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--creme);color:var(--azul);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:2.2rem 1.2rem}
  h1{font-size:1.4rem;margin:0 0 .2rem 0}
  .sub{color:var(--texto-2);font-size:.9rem;margin-bottom:1.6rem}
  .card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1rem}
  label{display:block;font-size:.76rem;font-weight:600;color:var(--azul);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem}
  input{width:100%;padding:10px 12px;border:1px solid var(--borda-forte);border-radius:8px;font-size:.95rem;margin-bottom:1rem;font-family:inherit;color:var(--azul)}
  button{background:var(--azul);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:.9rem;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  button.outline{background:#fff;color:var(--azul);border:1px solid var(--borda-forte)}
  .erro{color:var(--vermelho);font-size:.82rem;margin-bottom:.6rem;min-height:1rem}
  .doc-tipo{font-size:.8rem;font-weight:700;color:var(--azul);margin:1.1rem 0 .5rem;text-transform:uppercase;letter-spacing:.03em}
  .doc-tipo:first-child{margin-top:0}
  .doc-item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--borda);font-size:.9rem}
  .doc-item a{color:var(--azul);font-weight:600;text-decoration:none;border:1px solid var(--borda-forte);border-radius:8px;padding:5px 12px;font-size:.8rem;white-space:nowrap}
  .vazio{color:var(--texto-2);font-size:.88rem;padding:1rem 0;text-align:center}
  .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  .sair{font-size:.8rem;color:var(--texto-2);cursor:pointer;text-decoration:underline}
  .logo{font-weight:700;color:var(--ouro);letter-spacing:.03em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Portal do Colaborador</h1>
  <div class="sub"><span class="logo">Pão &amp; Tradição</span> · Padaria &amp; Confeitaria</div>

  <div class="card" id="tela-login">
    <div class="erro" id="login-erro"></div>
    <form id="form-login" onsubmit="event.preventDefault(); fazerLoginPortal();">
      <label>Nome completo</label>
      <input type="text" id="login-nome" name="username" placeholder="Digite seu nome completo" autocomplete="username">
      <label>CPF</label>
      <input type="password" id="login-cpf" name="password" placeholder="Só números" inputmode="numeric" autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
  </div>

  <div id="tela-doc" style="display:none">
    <div class="topo">
      <div><b id="doc-nome"></b></div>
      <span class="sair" onclick="sairPortal()">Sair</span>
    </div>
    <div class="card">
      <div id="doc-lista"></div>
    </div>
    <div class="card">
      <label>Trocar senha</label>
      <input type="password" id="nova-senha" placeholder="Nova senha (mínimo 6 caracteres)">
      <button class="outline" onclick="trocarSenhaPortal()">Salvar nova senha</button>
      <div class="erro" id="senha-status"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, updatePassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDyxGKkYEVxqQxW45nAR5ElQPWHh6SgSbU",
    authDomain: "gestao-de-rh-paoetradicao.firebaseapp.com",
    projectId: "gestao-de-rh-paoetradicao",
    storageBucket: "gestao-de-rh-paoetradicao.firebasestorage.app",
    messagingSenderId: "361260253500",
    appId: "1:361260253500:web:a2cc3fa027576ef9cf9e39"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const dbF = getFirestore(app);

  const TIPOS = {
    holerite_mensal: 'Holerite mensal',
    holerite_ferias: 'Holerite/Recibo de férias',
    aviso_ferias: 'Aviso de férias',
    notificacao: 'Notificação'
  };

  function normalizar(nome){
    return String(nome||'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');
  }

  window.fazerLoginPortal = async function(){
    const nome = document.getElementById('login-nome').value;
    const cpf = document.getElementById('login-cpf').value.replace(/\D/g,'');
    const erro = document.getElementById('login-erro');
    erro.textContent = '';
    if(!nome.trim() || cpf.length!==11){ erro.textContent='Preencha o nome e o CPF (11 números).'; return; }
    const email = normalizar(nome)+'@paoetradicao-rh.local';
    try{
      await signInWithEmailAndPassword(auth, email, cpf);
    }catch(e){
      erro.textContent = 'Nome ou CPF incorretos, ou o acesso ainda não foi criado pelo RH.';
    }
  };
  window.sairPortal = function(){ signOut(auth).then(function(){ location.reload(); }); };
  window.trocarSenhaPortal = async function(){
    const nova = document.getElementById('nova-senha').value;
    const status = document.getElementById('senha-status');
    status.style.color = 'var(--vermelho)';
    if(!nova || nova.length<6){ status.textContent='A nova senha precisa ter pelo menos 6 caracteres.'; return; }
    try{
      await updatePassword(auth.currentUser, nova);
      status.style.color = 'var(--verde)';
      status.textContent = 'Senha alterada! Use essa nova senha da próxima vez que entrar.';
      document.getElementById('nova-senha').value = '';
    }catch(e){
      status.textContent = 'Não foi possível trocar a senha agora. Saia, entre de novo e tente outra vez.';
    }
  };

  onAuthStateChanged(auth, async function(user){
    if(!user){
      document.getElementById('tela-login').style.display = '';
      document.getElementById('tela-doc').style.display = 'none';
      return;
    }
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-doc').style.display = '';
    const cont = document.getElementById('doc-lista');
    let perfilSnap;
    try{ perfilSnap = await getDoc(doc(dbF,'portal_funcionarios', user.uid)); }
    catch(e){ cont.innerHTML = '<div class="vazio">Não foi possível carregar seus dados agora. Tente novamente em instantes.</div>'; return; }
    if(!perfilSnap.exists()){
      document.getElementById('doc-nome').textContent = '';
      cont.innerHTML = '<div class="vazio">Seu cadastro ainda não está pronto. Fale com o RH.</div>';
      return;
    }
    const perfil = perfilSnap.data();
    document.getElementById('doc-nome').textContent = perfil.nome || '';
    const q = query(collection(dbF,'portal_documentos'), where('funcionarioId','==', perfil.funcionarioId));
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(function(d){ docs.push(d.data()); });
    if(!docs.length){ cont.innerHTML = '<div class="vazio">Nenhum documento disponível ainda.</div>'; return; }
    const grupos = {};
    docs.forEach(function(d){ (grupos[d.tipo]=grupos[d.tipo]||[]).push(d); });
    let html = '';
    Object.keys(TIPOS).forEach(function(tipo){
      if(!grupos[tipo] || !grupos[tipo].length) return;
      html += '<div class="doc-tipo">'+TIPOS[tipo]+'</div>';
      grupos[tipo].sort(function(a,b){ return (b.enviadoEm||'').localeCompare(a.enviadoEm||''); }).forEach(function(d){
        html += '<div class="doc-item"><span>'+(d.referencia||'—')+'</span><a href="'+d.url+'" target="_blank" rel="noopener">Ver PDF</a></div>';
      });
    });
    cont.innerHTML = html;
  });
</script>
</body>
</html>
